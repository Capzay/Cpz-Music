[package]
name = "cpz-app"
version = "0.1.0"
edition = "2024"
description = "Cpz Music for Linux, Windows and Android"

[[bin]]
name = "cpz-music"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
cpz-core = { path = "../core" }
dirs = "7.0.0"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.5", default-features = false }
slint = "1.19.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
webbrowser = "1.2.7"

[build-dependencies]
slint-build = "1.19.1"
