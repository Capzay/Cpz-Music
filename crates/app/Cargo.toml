[package]
name = "cpz-app"
version = "0.1.5"
edition = "2024"
description = "Cpz Music for Linux, Windows and Android"

# Android builds this as a cdylib (`cargo android`, see crates/xtask);
# the desktop links it into the binary.
[lib]
name = "cpz_app"
path = "src/lib.rs"

[[bin]]
name = "cpz-music"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
cpz-core = { path = "../core" }
dirs = "7.0.0"
fastrand = "2.5.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.5", default-features = false }
self-replace = "1.5.1"
semver = "1.0.28"
sha2 = "0.11"
slint = "1.19.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
webbrowser = "1.2.7"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19.1", features = ["backend-android-activity-06"] }
jni = "0.22"
ndk-context = "0.1"
paranoid-android = "0.2"

[build-dependencies]
slint-build = "1.19.1"
