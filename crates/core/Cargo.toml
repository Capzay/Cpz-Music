[package]
name = "cpz-core"
version = "0.1.0"
edition = "2024"
description = "Everything the Cpz Music apps share that is not drawing pixels"

[dependencies]
anyhow = "1"
base64 = "0.23"
fastrand = "2"
futures-util = "0.3"
getrandom = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
